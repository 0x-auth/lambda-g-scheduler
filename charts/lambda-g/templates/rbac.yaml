apiVersion: v1
kind: ServiceAccount
metadata:
  name: lambda-g-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lambda-g-role
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/binding"]
  verbs: ["create"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lambda-g-binding
subjects:
- kind: ServiceAccount
  name: lambda-g-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: lambda-g-role
  apiGroup: rbac.authorization.k8s.io
